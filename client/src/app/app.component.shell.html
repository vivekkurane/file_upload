<div class="storage-summary">
  <div class="container py-2">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="storage-badge">Database storage</span>
        <span class="storage-value">
          {{ loadingStorage ? 'Loading...' : ('Used ' + formatSize(storageSummary?.total ?? 0)) }}
        </span>
        <span class="storage-value text-muted" *ngIf="storageSummary?.remaining != null">
          • Remaining {{ formatSize(storageSummary?.remaining ?? null) }}
        </span>
      </div>
      <div class="storage-meta small text-muted">
        <span *ngIf="storageSummary?.quota != null">Quota {{ formatSize(storageSummary?.quota ?? null) }}</span>
        <span *ngIf="storageSummary?.count != null"> · {{ storageSummary?.count ?? 0 }} docs</span>
      </div>
    </div>
  </div>
</div>

<nav class="navbar navbar-light bg-white mb-3 mb-md-4 shadow-sm">
  <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
    <a class="navbar-brand font-weight-bold me-3" routerLink="/">Document Manager</a>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <a class="nav-link px-2" routerLink="/">Home</a>
      <a class="nav-link px-2" routerLink="/upload">Upload</a>
      <button *ngIf="canInstall" class="btn btn-gradient btn-pill" (click)="installPwa()">Install App</button>
    </div>
  </div>
</nav>

<div class="container">
  <router-outlet></router-outlet>
</div>
